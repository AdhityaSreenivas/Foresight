<!DOCTYPE html>
<html>
<head>
    <title>Login - SIF Console</title>
</head>

<body>

<h1>SIF Precursor Console</h1>

<form method="POST">

    {% csrf_token %}

    <input
        type="text"
        name="username"
        placeholder="Username"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <button type="submit">
        Login
    </button>

</form>

<a href="/register/">
    Create account
</a>

</body>
</html>
